packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  bcrypt: true
  prisma: true
  unrs-resolver: true
# Patched versions of indirect dependencies with published security advisories.
overrides:
  'multer@2': ^2.3.0
  'lodash@4': ^4.17.24
  'qs@6': ^6.16.0
  'body-parser@1': ^1.20.6
  'brace-expansion@1': ^1.1.21
  'brace-expansion@2': ^2.1.7
  'nanoid@3': ^3.3.18
  'js-yaml@5': ^5.4.1
  'postcss@8': ^8.5.23
